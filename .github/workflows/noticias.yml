name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer noticias
        run: node scripts/noticias.mjs
      - name: Guardar si hay cambios
        run: |
          if git diff --quiet -- noticias.json; then echo "Nada nuevo"; exit 0; fi
          git config user.name "robot-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora de Colombia)"
          git pull --rebase origin main
          git push
